name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in Adaptive Prompt Compressor
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide detailed steps to reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Initialize LinUCBCompressor(provider='openai')
        2. Call compressor.compress(prompt)
        3. See error...
    validations:
      required: true
  - type: textarea
    id: prompt_sample
    attributes:
      label: Prompt Sample
      description: The prompt text that triggered the issue (please sanitize any private credentials).
    validations:
      required: false
  - type: dropdown
    id: python_version
    attributes:
      label: Python Version
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, package versions (`uv pip list` or `pip list`), target model (`gpt-4o`, `gpt-4o-mini`, etc.)
