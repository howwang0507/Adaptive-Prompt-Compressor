name: 🐛 Bug Report
description: Report an issue or unexpected behavior in Adaptive Prompt Compressor
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Code snippet or prompt example that reproduces the issue.
      placeholder: |
        ```python
        from src.interface import LinUCBCompressor
        compressor = LinUCBCompressor(provider="openai")
        compressor.compress("...")
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, model provider (e.g., Python 3.11, macOS, OpenAI gpt-4o).
    validations:
      required: false
