name: 🚀 Feature Request
description: Suggest a new feature, model support, or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love hearing ideas for improving Adaptive Prompt Compressor!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution you'd like to see implemented (e.g., support for OpenAI Structured Outputs, Prompt Caching alignment, new bandit arms).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Any other solutions or workarounds you've explored.
