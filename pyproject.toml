[project]
name = "adaptive-prompt-compressor"
version = "1.1.1"
description = "Task-aware dynamic prompt compression using LinUCB Contextual Bandits with first-class OpenAI support."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MINGHAO WANG", email = "howwang0507@example.com" }
]
license = { text = "MIT" }
keywords = ["llm", "openai", "prompt-engineering", "prompt-compression", "contextual-bandits", "linucb", "token-optimization", "mcp", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/howwang0507/Adaptive-Prompt-Compressor"
Documentation = "https://github.com/howwang0507/Adaptive-Prompt-Compressor#readme"
Repository = "https://github.com/howwang0507/Adaptive-Prompt-Compressor.git"
Issues = "https://github.com/howwang0507/Adaptive-Prompt-Compressor/issues"
Changelog = "https://github.com/howwang0507/Adaptive-Prompt-Compressor/blob/main/CHANGELOG.md"

[project.scripts]
prompt-compressor = "src.cli:main"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.2.0",
    "google-generativeai>=0.3.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.25.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "python-docx>=0.8.11",
    "google-cloud-aiplatform>=1.148.1",
    "sentence-transformers>=5.1.2",
    "bert-score>=0.3.13",
    "openai>=2.38.0",
    "anthropic>=0.105.2",
    "nltk>=3.9.2",
    "redis>=7.0.1",
    "seaborn>=0.13.2",
    "mcp>=1.27.2",
    "tiktoken>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.3.1",
    "black>=23.3.0",
    "ruff>=0.0.270",
    "mypy>=1.3.0",
    "types-requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

